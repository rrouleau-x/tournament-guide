name: Deploy to GitHub Pages

# This workflow is what ENABLES Pages on this repo. `actions/configure-pages`
# with `enablement: true` turns Pages on through the API using the workflow's
# own GITHUB_TOKEN — no personal access token, no Settings-page taps.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (enables Pages if it is not already on)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site (static, no build step)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
